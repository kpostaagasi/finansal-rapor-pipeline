name: Günlük rapor üretimi + yayın (Mac'siz)

on:
  schedule:
    # Hedef: 11:07 TRT = 08:07 UTC. GitHub'ın schedule teslimatı bu depoda
    # 27.08.2026'dan beri 4.5-12 saat gecikiyor (ölçüm: hedef 08:07 UTC,
    # gerçek tetikleme 12:41-20:10 UTC). Cron'da düzeltilecek bir şey yok;
    # tek çare erken saatlerden itibaren birden çok kayıt bırakıp hangisi
    # zamanında gelirse onu kullanmak. Hangi tetikleme gelirse gelsin
    # gerçek kararı aşağıdaki 'kapi' işi verir: hedef saatten önce ya da
    # bugün zaten yayınlanmışsa koşu atlanır (birkaç saniyelik boş iş).
    - cron: "7 2 * * 1-5"
    - cron: "7 3 * * 1-5"
    - cron: "7 4 * * 1-5"
    - cron: "7 5 * * 1-5"
    - cron: "7 6 * * 1-5"
    - cron: "7 7 * * 1-5"
    - cron: "7 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kapi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    outputs:
      calis: ${{ steps.karar.outputs.calis }}
    steps:
      # Public depoda 60 gün aktivite olmazsa GitHub zamanlanmış workflow'u
      # kapatır; bu depoya günlük commit gitmiyor. Workflow'u API ile yeniden
      # etkinleştirmek sayacı sıfırlar. Başarısız olursa üretimi engellemez.
      - name: Zamanlamayı canlı tut
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/production.yml/enable"
      - id: karar
        env:
          OLAY: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Elle tetikleme her zaman çalışır (yeniden yayın kastıdır).
          if [ "$OLAY" != "schedule" ]; then
            echo "calis=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 1) Hedef saatten önce gelen erken cron'lar: atla.
          if (( 10#$(date -u +%H%M) < 807 )); then
            echo "::notice::$(date -u +%H:%M) UTC < 08:07 UTC hedefi — atlandı."
            echo "calis=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 2) Bugün zaten yayınlanmışsa atla. Tek doğru kaynak yayınlanan
          #    site: report_status.json'daki en yeni last_successful_run.
          #    Site okunamazsa fail-open (iki kez yayınlamak, hiç
          #    yayınlamamaktan iyidir; yayın adımı idempotent).
          son=$(curl -fsS --max-time 20 \
                  https://kpostaagasi.github.io/finansal-raporlar/report_status.json \
                | jq -r '[.[].last_successful_run // empty] | max // ""') || son=""
          if [ "${son:0:10}" = "$(TZ=Europe/Istanbul date +%F)" ]; then
            echo "::notice::Bugün zaten yayınlanmış ($son) — atlandı."
            echo "calis=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "calis=true" >> "$GITHUB_OUTPUT"

  uretim:
    needs: kapi
    if: needs.kapi.outputs.calis == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıklar
        run: pip install -r requirements.txt
      # TEFAS tarihçesi repo'da seed'li (Mac'ten tek seferlik): bootstrap yok,
      # üreticiler seed'den başlayıp eksik günleri çeker (~1-2 dk).
      # Ek rapor = ek istek maliyeti değil: TEFAS isteği fon tipine göre tüm
      # evreni döndürür, kapsam filtresi istemci tarafındadır; her rapor kendi
      # cache'ini artımlı tazeler.
      - name: Üreticiler (mail kapalı — dry-run)
        env:
          TZ: Europe/Istanbul
        run: |
          # GitHub Actions 'run:' adımları varsayılan olarak `bash -e` ile
          # çalışır: herhangi bir komut sıfırdışı dönerse adım hemen durur.
          # Kısmi kapsam (bazı fon/grup bulunamadı) günlük olağan bir durumdur
          # ve yayını durdurmamalı (B4) — bu yüzden -e burada kapatılıp her
          # üreticinin çıkış kodu elle sınıflandırılıyor. Adım her koşulda
          # başarıyla biter; gerçek üretim hataları sonraki 'Site build'
          # adımına --failure=hedef=mesaj olarak taşınıp dashboard'da
          # 'failed' gösterilir (o raporun son bilinen iyi hali korunur).
          set +e

          : > /tmp/uretim_basarisizlar.txt

          calistir_tefas() {
            # $1=rapor adı (raporlar/<ad>.json), $2=build_site.py REPORTS hedefi.
            # tefas_secili.py exit kodları (main(), 3_tefas_fon_akis_maili/tefas_secili.py
            # satır 783-817'de doğrulandı):
            #   0 = tam kapsam
            #   4 = kısmi kapsam: bazı fon/grup bulunamadı ya da önceki TEFAS
            #       gözlemi olmadığı için akış hesaplanamadı — HTML yine de
            #       o günün doğru REPORT_META'sıyla YENİDEN ÜRETİLDİ
            #       (build_site.py bunu otomatik 'partial' gösterir,
            #       --failure GEREKMEZ)
            #   diğer = yakalanmamış hata (ör. RuntimeError): HTML YENİDEN
            #       ÜRETİLMEDİ, son bilinen iyi hali kalır → 'failed' işaretlenir
            local rapor="$1" hedef="$2"
            python 3_tefas_fon_akis_maili/tefas_secili.py --rapor "$rapor"
            local kod=$?
            if [ "$kod" -eq 4 ]; then
              echo "::warning::$hedef kısmi kapsamla üretildi (--rapor $rapor, exit 4)"
            elif [ "$kod" -ne 0 ]; then
              echo "::error::$hedef üretilemedi (--rapor $rapor, exit $kod)"
              echo "--failure=$hedef=TEFAS $rapor raporu üretilemedi (exit $kod)" >> /tmp/uretim_basarisizlar.txt
            fi
          }

          python 1_emtia_tahvil_maili/emtia_report.py
          kod=$?
          # emtia_report.py main() (1_emtia_tahvil_maili/emtia_report.py) eşiği
          # kendi içinde uygular: en az 5 emtia eğrisi + faiz eğrisi yoksa 3
          # deneme sonunda HTML'i YAZMADAN 1 ile çıkar (son bilinen iyi hali
          # korunur). 0 = emtia_futures.html tazelendi.
          if [ "$kod" -ne 0 ]; then
            echo "::error::emtia_futures.html üretilemedi (emtia_report.py, exit $kod)"
            echo "--failure=emtia_futures.html=Emtia/ABD Hazine üretimi başarısız (exit $kod)" >> /tmp/uretim_basarisizlar.txt
          fi

          calistir_tefas altin tefas_altin_fon_bazinda.html
          calistir_tefas secili tefas_secili_akis.html
          calistir_tefas kiymetli_maden tefas_kiymetli_maden.html
          calistir_tefas para_piyasasi tefas_para_piyasasi.html
          calistir_tefas katilim tefas_katilim.html
          calistir_tefas hisse tefas_hisse.html
          calistir_tefas borclanma tefas_borclanma.html
          # gruplar türetilmiş rapor: kaynak raporların önbelleklerini toplar,
          # bu yüzden EN SON çalışmalı.
          calistir_tefas gruplar tefas_fon_gruplari.html

          if [ -s /tmp/uretim_basarisizlar.txt ]; then
            echo "::error::$(wc -l < /tmp/uretim_basarisizlar.txt | tr -d ' ') rapor gerçek hatayla üretilemedi; bunlar dashboard'da 'failed' gösterilecek, diğer raporlar normal yayınlanır."
          fi
      - name: Site build (index.html + report_status.json)
        run: |
          basarisizlik_args=()
          if [ -f /tmp/uretim_basarisizlar.txt ]; then
            while IFS= read -r satir; do
              [ -n "$satir" ] && basarisizlik_args+=("$satir")
            done < /tmp/uretim_basarisizlar.txt
          fi
          python build_site.py "${basarisizlik_args[@]}"
      # Builder + doğrulayıcı pipeline içinde (bv-fon-dashboard'dan senkron kopya;
      # o repo private olduğundan Actions'ta clone edilemez). --source-root . =
      # pipeline checkout'undaki üretilmiş HTML'ler.
      - name: Dashboard artifact build (JSON'lar)
        run: |
          python scripts/build_research_artifacts.py --source-root . --output-dir artifacts
      # Yayın adlarının tek kaynağı build_site.py'deki REPORTS tablosu:
      # site/ klasörü zaten doğru dosya adlarıyla üretilmiş rapor kopyalarını,
      # index.html'i, report_status.json'ı ve .nojekyll'i içeriyor. Raporları
      # tek tek kopyalamak ad kaymasına yol açıyordu (fon bazlı altın raporu
      # tefas_altin_akis.html olarak yayınlanıp dashboard'un linklediği
      # tefas_altin_fon_bazinda.html güncellenmiyordu).
      - name: Yayın dosyalarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: yayin-dosyalari
          if-no-files-found: error
          include-hidden-files: true
          path: |
            site/
            artifacts/fund_flows.json
            artifacts/commodities_treasury.json
            artifacts/manifest.json

  yayin-pages:
    needs: uretim
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kpostaagasi/finansal-raporlar
          ssh-key: ${{ secrets.RAPORLAR_DEPLOY_KEY }}
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: yayin-dosyalari
          path: /tmp/yayin
      - name: Eski yayın dosyalarını temizle
        run: |
          # FAIL-CLOSED: kaynak artifact indirme hatası, boş çalışma vb.
          # yüzünden eksikse temizliğe hiç girme — aksi halde hedef depodaki
          # her şeyi silme riskimiz olur.
          for beklenen in /tmp/yayin/site/index.html /tmp/yayin/site/report_status.json; do
            if [ ! -s "$beklenen" ]; then
              echo "HATA: $beklenen yok veya boş, temizlik iptal edildi." >&2
              exit 1
            fi
          done
          # Bugün yayınlanacak kümenin dosya adları: site/ içindekiler + kök
          # dizine ayrıca kopyalanan 3 artifact json'ı.
          beklenenler=$(mktemp)
          {
            find /tmp/yayin/site -maxdepth 1 \( -name '*.html' -o -name '*.json' \) -exec basename {} \;
            echo fund_flows.json
            echo commodities_treasury.json
            echo manifest.json
          } | sort -u > "$beklenenler"
          # Hedef depo kökünde (yalnızca üst düzey; .git ve alt klasörlere
          # dokunulmaz), yayınlanan türden (html/json) ama artık yayınlanan
          # kümede olmayan dosyaları sil (ör. ad kayması sonrası ortada kalan
          # eski tefas_altin_akis.html). git rm + açık liste karşılaştırması
          # rsync --delete yerine tercih edildi: filtre kurallarıyla uğraşmadan
          # "sadece kök + sadece html/json" sınırını doğrudan garanti eder,
          # .nojekyll/README/LICENSE gibi depo dosyaları hiç aday olmaz.
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.json' \) | while read -r dosya; do
            ad=$(basename "$dosya")
            if ! grep -qxF "$ad" "$beklenenler"; then
              echo "Siliniyor (artık yayınlanmıyor): $ad"
              git rm -q -f -- "$ad" 2>/dev/null || rm -f -- "$dosya"
            fi
          done
          rm -f "$beklenenler"
      - name: Dosyaları kopyala + commit + push
        run: |
          cp -a /tmp/yayin/site/. ./
          cp /tmp/yayin/artifacts/fund_flows.json ./
          cp /tmp/yayin/artifacts/commodities_treasury.json ./
          cp /tmp/yayin/artifacts/manifest.json ./
          git config user.name "rapor-pipeline"
          git config user.email "pipeline@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            # Pratikte hemen hiç tetiklenmez: her rapor generated_at/last_successful_run
            # damgasını taze basar, bu yüzden içerik her koşuda en az bir bayt değişir.
            # Yine de savunma amaçlı (ör. tüm üreticiler aynı gün ikinci kez no-op çalışırsa) duruyor.
            echo "Değişiklik yok."
          else
            git commit -m "Raporlar güncellendi ($(date +'%d.%m.%Y %H:%M'))"
            git push origin main
          fi
