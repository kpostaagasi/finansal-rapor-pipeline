name: Günlük rapor üretimi + yayın (Mac'siz)

on:
  schedule:
    # Hafta içi 11:07 TRT = 08:07 UTC (tam saat başı yoğunluğundan kaçınır)
    - cron: "7 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uretim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıklar
        run: pip install -r requirements.txt
      # TEFAS tarihçesi repo'da seed'li (Mac'ten tek seferlik): bootstrap yok,
      # üreticiler seed'den başlayıp eksik günleri çeker (~1-2 dk).
      - name: Üreticiler (mail kapalı — dry-run)
        env:
          TZ: Europe/Istanbul
        run: |
          python 1_emtia_tahvil_maili/gunluk_mail.py --dry-run
          python 3_tefas_fon_akis_maili/tefas_secili.py --rapor altin
          python 3_tefas_fon_akis_maili/tefas_secili.py --rapor secili
      - name: Site build (index.html + report_status.json)
        run: python build_site.py
      # Builder + doğrulayıcı pipeline içinde (bv-fon-dashboard'dan senkron kopya;
      # repo private olduğundan Actions'ta clone edilemez). --source-root . =
      # pipeline checkout'undaki üretilmiş HTML'ler.
      - name: Dashboard artifact build (JSON'lar)
        run: |
          python scripts/build_research_artifacts.py --source-root . --output-dir artifacts
      - name: Yayın dosyalarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: yayin-dosyalari
          if-no-files-found: error
          path: |
            1_emtia_tahvil_maili/emtia_futures.html
            2_tefas_altin_akis/tefas_net_akis.html
            3_tefas_fon_akis_maili/tefas_altin_akis.html
            3_tefas_fon_akis_maili/tefas_secili_akis.html
            site/index.html
            site/report_status.json
            artifacts/fund_flows.json
            artifacts/commodities_treasury.json
            artifacts/manifest.json

  yayin-pages:
    needs: uretim
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kpostaagasi/finansal-raporlar
          ssh-key: ${{ secrets.RAPORLAR_DEPLOY_KEY }}
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: yayin-dosyalari
          path: /tmp/yayin
      - name: Dosyaları kopyala + commit + push
        run: |
          cp /tmp/yayin/1_emtia_tahvil_maili/emtia_futures.html ./
          cp /tmp/yayin/2_tefas_altin_akis/tefas_net_akis.html ./
          cp /tmp/yayin/3_tefas_fon_akis_maili/tefas_altin_akis.html ./
          cp /tmp/yayin/3_tefas_fon_akis_maili/tefas_secili_akis.html ./
          cp /tmp/yayin/site/index.html ./
          cp /tmp/yayin/site/report_status.json ./
          cp /tmp/yayin/artifacts/fund_flows.json ./
          cp /tmp/yayin/artifacts/commodities_treasury.json ./
          cp /tmp/yayin/artifacts/manifest.json ./
          git config user.name "rapor-pipeline"
          git config user.email "pipeline@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Raporlar güncellendi ($(date +'%d.%m.%Y %H:%M'))"
            git push origin main
          fi
